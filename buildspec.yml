version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "281089586720"
    IMAGE_REPO_NAME: "brain-react-app"
    AWS_REGION: "ap-south-1"
    IMAGE_TAG: "latest"
    CLUSTER_NAME: "brain-cluster"
    KUBE_NAMESPACE: "default"

phases:
  install:
    commands:
      - echo "Installing kubectl..."
      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin/kubectl
      - kubectl version --client

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ECR_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Updating kubeconfig for EKS cluster..."
      - aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME --kubeconfig $HOME/.kube/config
      - mkdir -p $HOME/.kube
      - aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image..."
      - docker build -t $ECR_REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $ECR_REPOSITORY_URI:$IMAGE_TAG $ECR_REPOSITORY_URI:latest

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Pushing the Docker image..."
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
      - docker push $ECR_REPOSITORY_URI:latest
      - echo "Verifying kubectl access..."
      - kubectl cluster-info
      - echo "Applying Kubernetes manifests..."
      - kubectl apply -f k8s/deployment.yml -n $KUBE_NAMESPACE
      - kubectl apply -f k8s/service.yml -n $KUBE_NAMESPACE
      - echo "Waiting for deployment to be ready..."
      - kubectl rollout status deployment/brain-react-app -n $KUBE_NAMESPACE --timeout=5m
      - echo "Deployment completed successfully!"

artifacts:
  files:
    - '**/*'
  name: BuildArtifact

cache:
  paths:
    - '/root/.docker/**/*'


