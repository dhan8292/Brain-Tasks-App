version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "281089586720"
    IMAGE_REPO_NAME: "brain-react-app"
    AWS_REGION: "ap-south-1"
    CLUSTER_NAME: "brain-cluster"
    KUBE_NAMESPACE: "default"

phases:
  install:
    commands:
      - echo "Installing kubectl..."
      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin/kubectl
      - kubectl version --client

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo "Pushing to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo "Updating kubeconfig..."
      - aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME
      - echo "Deploying to EKS..."
      - kubectl apply -f k8s/deployment.yml -n $KUBE_NAMESPACE
      - kubectl apply -f k8s/service.yml -n $KUBE_NAMESPACE
      - echo "Waiting for rollout..."
      - kubectl rollout status deployment/brain-react-app -n $KUBE_NAMESPACE --timeout=5m
      - echo "Deployment successful!"
      - mkdir -p build-output
      - echo "Pipeline completed" > build-output/deployment.txt

artifacts:
  files:
    - build-output/deployment.txt
  name: BuildOutput
  
cache:
  paths:
    - '/root/.npm/**/*'
    - '/root/.m2/**/*'


