version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "281089586720"
    IMAGE_REPO_NAME: "brain-react-app"
    AWS_DEFAULT_REGION: "ap-south-1"
    IMAGE_TAG: "latest"
    EKS_CLUSTER_NAME: "brain-cluster"

phases:
  install:
    commands:
      - echo "Installing kubectl..."
      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/

  pre_build:
    commands:
      - echo "Logging into Amazon ECR..."
      - aws --version
      - docker --version
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URL=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPO_URI=$ECR_URL/$IMAGE_REPO_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URL
      - echo "Updating kubeconfig..."
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $EKS_CLUSTER_NAME

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image..."
      - docker build -t $REPO_URI:$IMAGE_TAG .
      - docker images

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $REPO_URI:$IMAGE_TAG
      - echo "Deploying to EKS..."
      - kubectl apply -f k8s/deployment.yml --validate=false
      - kubectl apply -f k8s/service.yml --validate=false
      - echo "Deployment completed successfully!"

artifacts:
  files:
    - '**/*'

